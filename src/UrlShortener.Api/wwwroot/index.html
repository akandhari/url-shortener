<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>URL Shortener</h1>
    <p class="hint">Paste a long link and get a short one you can share.</p>

    <form id="shorten-form" novalidate>
      <label for="url">Long URL</label>
      <div class="row">
        <input id="url" name="url" type="text" inputmode="url" autocomplete="off"
               placeholder="https://example.com/a/very/long/page" required>
        <button id="shorten" type="submit">Shorten</button>
      </div>
      <label for="alias" class="optional">Custom alias <span class="unit">(optional, e.g. fall-sale)</span></label>
      <input id="alias" name="alias" type="text" autocomplete="off" maxlength="32" placeholder="leave empty for a random code">
      <label for="expires" class="optional">Expires</label>
      <select id="expires" name="expires">
        <option value="">Never</option>
        <option value="1">After 1 day</option>
        <option value="7">After 7 days</option>
        <option value="30">After 30 days</option>
      </select>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <section id="result" class="result" hidden aria-live="polite">
      <label>Your short link</label>
      <div class="row">
        <a id="short-url" target="_blank" rel="noopener noreferrer"></a>
        <button id="copy" type="button">Copy</button>
      </div>
      <p class="meta">Goes to: <span id="target-url"></span></p>
      <p class="meta">Status: <span id="status"></span></p>
      <p class="meta">Clicks: <strong id="clicks">0</strong>
        <button id="refresh" type="button" class="link-button">Refresh</button>
      </p>

      <div class="stats">
        <div>
          <h2>Clicks per day <span class="unit">(UTC, last 30 days)</span></h2>
          <ul id="per-day" class="stat-list"></ul>
        </div>
        <div>
          <h2>Top referrers</h2>
          <ul id="referrers" class="stat-list"></ul>
        </div>
      </div>
    </section>

    <footer>
      <a href="/scalar">API documentation</a>
    </footer>
  </main>
</body>
</html>
